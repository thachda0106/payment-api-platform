# AI Development Template Manifest
# This file declares template metadata and installed capabilities.

template:
  name: "universal-ai-dev-template"
  version: "1.0.0"
  description: "Tool-agnostic AI development template with adapter pattern"

# Installed adapters (populated by install-ai-template.sh)
adapters: []
  # - claude
  # - antigravity
  # - cursor
  # - aider

# Canonical modules included in this template
modules:
  agents:
    - bug-hunter
    - code-reviewer
    - doc-keeper
    - feature-builder
    - performance-optimizer
    - test-engineer
  workflows:
    - ai-workflow
    - create-feature
    - fix-bug
    - review-pr
    - add-tests
    - get-docs
    - review-architecture
    - refactor-feature
    - add-api-integration
    - explain-logic
    - optimize-performance
    - update-docs
  skills:
    - analyze-project-structure
    - apply-targeted-fix
    - diagnose-bug-root-cause
    - locate-code-patterns
    - trace-execution-flow
    - validate-architecture
    - verify-bug-regression

# Operating model
operating_model: "plan-review-execute-verify"
