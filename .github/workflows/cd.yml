# ============================================================================
# cd.yml — Multi-Language CD Pipeline (Phase 6)
# ============================================================================
# Triggered on push to main.
# 1. Builds Docker images
# 2. Validates images (runtime liveness check before push)
# 3. Pushes to GitHub Container Registry
# 4. Smoke tests pushed images
# 5. Security scans (Trivy)
# ============================================================================

name: CD

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'docker/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ═════════════════════════════════════════════════════════════════════════
  # BUILD, VALIDATE & PUSH
  # ═════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: "Build, Validate & Push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── Java ───
          - service: financial-core
            language: java
            context: services/java/financial-core
            dockerfile: docker/Dockerfile.java
            port: "8080"
          - service: payment-service
            language: java
            context: services/java/payment-service
            dockerfile: docker/Dockerfile.java
            port: "8081"
          # ─── Python ───
          - service: fraud-service
            language: python
            context: services/python/fraud-service
            dockerfile: docker/Dockerfile.python
            port: "8000"
          # ─── Node.js ───
          - service: notification-service
            language: nodejs
            context: services/nodejs/notification-service
            dockerfile: docker/Dockerfile.nodejs
            port: "3001"
          # ─── Go ───
          - service: settlement-service
            language: go
            context: services/go/settlement-service
            dockerfile: docker/Dockerfile.go
            port: "8088"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (without push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Runtime validation: start container, check liveness ───
      - name: Validate image runtime (liveness check)
        run: |
          echo "Starting ${{ matrix.service }} for runtime validation..."
          docker run -d --rm --name ci-${{ matrix.service }} \
            -e SERVER_PORT=${{ matrix.port }} \
            -e OTEL_SERVICE_NAME=${{ matrix.service }} \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 \
            -e LOG_LEVEL=info \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            ${{ matrix.service }}:ci

          # Wait for service to start (max 60s)
          echo "Waiting for liveness..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:${{ matrix.port }}/liveness > /dev/null 2>&1; then
              echo "  Liveness OK (attempt $i)"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "  FAIL: Liveness check failed after 60s"
              docker logs ci-${{ matrix.service }} --tail=20
              exit 1
            fi
            sleep 5
          done

          # Show probe response
          curl -s http://localhost:${{ matrix.port }}/liveness | head -c 300
          echo ""

          docker stop ci-${{ matrix.service }}

      # ─── Push after validation passes ───
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═════════════════════════════════════════════════════════════════════════
  # SMOKE TEST (against pushed images)
  # ═════════════════════════════════════════════════════════════════════════
  smoke-test:
    name: Smoke Test Pushed Images
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull and validate financial-core
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/financial-core:latest
          docker run -d --rm --name smoke-financial-core \
            -e SERVER_PORT=8080 -e OTEL_SERVICE_NAME=financial-core \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 -p 8080:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/financial-core:latest
          sleep 15
          curl -sf http://localhost:8080/liveness && echo "  financial-core: OK" || echo "  financial-core: FAIL"
          docker stop smoke-financial-core

      - name: Pull and validate payment-service
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/payment-service:latest
          docker run -d --rm --name smoke-payment-service \
            -e SERVER_PORT=8081 -e OTEL_SERVICE_NAME=payment-service \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 -p 8081:8081 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/payment-service:latest
          sleep 15
          curl -sf http://localhost:8081/liveness && echo "  payment-service: OK" || echo "  payment-service: FAIL"
          docker stop smoke-payment-service

      - name: Pull and validate fraud-service
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/fraud-service:latest
          docker run -d --rm --name smoke-fraud-service \
            -e SERVER_PORT=8000 -e OTEL_SERVICE_NAME=fraud-service \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 -p 8000:8000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/fraud-service:latest
          sleep 15
          curl -sf http://localhost:8000/liveness && echo "  fraud-service: OK" || echo "  fraud-service: FAIL"
          docker stop smoke-fraud-service

      - name: Pull and validate notification-service
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification-service:latest
          docker run -d --rm --name smoke-notification-service \
            -e SERVER_PORT=3001 -e OTEL_SERVICE_NAME=notification-service \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 -p 3001:3001 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification-service:latest
          sleep 15
          curl -sf http://localhost:3001/liveness && echo "  notification-service: OK" || echo "  notification-service: FAIL"
          docker stop smoke-notification-service

      - name: Pull and validate settlement-service
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/settlement-service:latest
          docker run -d --rm --name smoke-settlement-service \
            -e SERVER_PORT=8088 -e OTEL_SERVICE_NAME=settlement-service \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 -p 8088:8088 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/settlement-service:latest
          sleep 15
          curl -sf http://localhost:8088/liveness && echo "  settlement-service: OK" || echo "  settlement-service: FAIL"
          docker stop smoke-settlement-service

  # ═════════════════════════════════════════════════════════════════════════
  # SECURITY SCAN (Trivy)
  # ═════════════════════════════════════════════════════════════════════════
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        service:
          - financial-core
          - payment-service
          - fraud-service
          - notification-service
          - settlement-service
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
