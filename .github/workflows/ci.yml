# ============================================================================
# ci.yml — Multi-Language CI Pipeline (Phase 6)
# ============================================================================
# Runs on every push and pull request.
#  - build-libs: builds platform libraries first
#  - Per-language: lint, test, build (only existing 4 services)
#  - arch-test: verifies package boundaries, port uniqueness
#  - system-smoke-test: docker-compose up + probe checks
# ============================================================================

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'shared/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'shared/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:

  # ═════════════════════════════════════════════════════════════════════════
  # BUILD PLATFORM LIBS (must run before services)
  # ═════════════════════════════════════════════════════════════════════════
  build-libs:
    name: Build Platform Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Java libs
        run: cd libs/java && mvn install -DskipTests -B -q

      - name: Build Go libs
        run: cd libs/go && go build ./pkg/...

      - name: Build Python libs
        run: cd libs/python && pip install -e .

      - name: Build Node.js libs
        run: cd libs/nodejs && npm install && npm run build

  # ═════════════════════════════════════════════════════════════════════════
  # JAVA SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  java:
    name: "Java — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        service:
          - financial-core
          - payment-service
    defaults:
      run:
        working-directory: services/java/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build libs (install to local repo)
        run: cd ../../libs/java && mvn install -DskipTests -B -q

      - name: Test
        run: mvn test -B

      - name: Package
        run: mvn package -DskipTests -B

  # ═════════════════════════════════════════════════════════════════════════
  # PYTHON SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  python:
    name: "Python — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        service:
          - fraud-service
    defaults:
      run:
        working-directory: services/python/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libs + deps
        run: |
          pip install --upgrade pip -q
          pip install -e ../../libs/python -q
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt -q; elif [ -f requirements.txt ]; then pip install -r requirements.txt -q; fi

      - name: Test
        run: pytest -v --tb=short

  # ═════════════════════════════════════════════════════════════════════════
  # NODE.JS SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  nodejs:
    name: "Node.js — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        service:
          - notification-service
    defaults:
      run:
        working-directory: services/nodejs/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/nodejs/${{ matrix.service }}/package-lock.json

      - name: Install libs + deps
        run: |
          cd ../../libs/nodejs && npm install && npm run build
          cd - && npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --if-present

  # ═════════════════════════════════════════════════════════════════════════
  # GO SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  go:
    name: "Go — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: build-libs
    strategy:
      fail-fast: false
      matrix:
        service:
          - settlement-service
    defaults:
      run:
        working-directory: services/go/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/go/${{ matrix.service }}/go.sum

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/go/${{ matrix.service }}
          args: --timeout=5m

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Build
        run: go build ./...

  # ═════════════════════════════════════════════════════════════════════════
  # ARCHITECTURE FITNESS TESTS
  # ═════════════════════════════════════════════════════════════════════════
  arch-test:
    name: Architecture Fitness Tests
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4

      - name: Check port uniqueness
        run: bash libs/archtest/scripts/check-port-uniqueness.sh docker-compose.yml

      - name: Check config completeness
        run: bash libs/archtest/scripts/check-config-completeness.sh docker-compose.yml

      - name: Verify import boundaries (Go)
        run: |
          cd libs/go
          # Verify no forbidden cross-package imports
          ! grep -r "pkg/health" pkg/telemetry/ 2>/dev/null || { echo "ERROR: telemetry imports health"; exit 1; }
          ! grep -r "pkg/telemetry" pkg/health/ 2>/dev/null || { echo "ERROR: health imports telemetry"; exit 1; }
          ! grep -r "pkg/health" pkg/config/ 2>/dev/null || { echo "ERROR: config imports health"; exit 1; }
          echo "Go import boundaries: OK"

  # ═════════════════════════════════════════════════════════════════════════
  # DOCKER BUILD (main push only)
  # ═════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [java, python, nodejs, go]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build financial-core
        run: docker build -f docker/Dockerfile.java -t financial-core:ci services/java/financial-core
      - name: Build fraud-service
        run: docker build -f docker/Dockerfile.python -t fraud-service:ci services/python/fraud-service
      - name: Build notification-service
        run: docker build -f docker/Dockerfile.nodejs -t notification-service:ci services/nodejs/notification-service
      - name: Build settlement-service
        run: docker build -f docker/Dockerfile.go -t settlement-service:ci services/go/settlement-service

  # ═════════════════════════════════════════════════════════════════════════
  # SYSTEM SMOKE TEST
  # ═════════════════════════════════════════════════════════════════════════
  system-smoke-test:
    name: System Smoke Test
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure + services
        run: docker-compose up -d
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 60
          docker-compose ps

      - name: Smoke test — probe endpoints
        run: |
          echo "=== Java financial-core ==="
          curl -sf http://localhost:8080/liveness | head -c 200
          echo ""
          curl -sf http://localhost:8080/readiness | head -c 200 || echo "(503 expected if deps not ready)"
          echo ""

          echo "=== Java payment-service ==="
          curl -sf http://localhost:8081/liveness | head -c 200
          echo ""
          curl -sf http://localhost:8081/readiness | head -c 200 || echo "(503 expected if deps not ready)"
          echo ""

          echo "=== Python fraud-service ==="
          curl -sf http://localhost:8000/liveness | head -c 200
          echo ""
          curl -sf http://localhost:8000/readiness | head -c 200 || echo "(503 expected if deps not ready)"
          echo ""

          echo "=== Node.js notification-service ==="
          curl -sf http://localhost:3001/liveness | head -c 200
          echo ""
          curl -sf http://localhost:3001/readiness | head -c 200 || echo "(503 expected if deps not ready)"
          echo ""

          echo "=== Go settlement-service ==="
          curl -sf http://localhost:8088/liveness | head -c 200
          echo ""
          curl -sf http://localhost:8088/readiness | head -c 200 || echo "(503 expected if deps not ready)"
          echo ""

          echo "=== All probes responded ==="

      - name: Show logs on failure
        if: failure()
        run: docker-compose logs --tail=100
