# ============================================================================
# ci.yml — Multi-Language CI Pipeline
# ============================================================================
# Runs on every push and pull request.
# Parallel matrix builds for Java, Python, Node.js, Go.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:

  # ═════════════════════════════════════════════════════════════════════════
  # JAVA SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  java:
    name: "Java (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - financial-core
          - payment-service
          - refund-service
          - fx-service
          - treasury-service
    defaults:
      run:
        working-directory: services/java/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Lint (Checkstyle)
        run: mvn checkstyle:check -B -q || echo "Checkstyle not configured — skipping"

      - name: Test
        run: mvn test -B

      - name: Build
        run: mvn package -DskipTests -B

  # ═════════════════════════════════════════════════════════════════════════
  # PYTHON SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  python:
    name: "Python (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - fraud-service
    defaults:
      run:
        working-directory: services/python/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install -e . 2>/dev/null || true

      - name: Lint (Ruff)
        run: ruff check . 2>/dev/null || echo "Ruff not configured — skipping"

      - name: Type check (Mypy)
        run: mypy src/ --ignore-missing-imports 2>/dev/null || echo "Mypy not configured — skipping"

      - name: Test
        run: pytest -v --tb=short

  # ═════════════════════════════════════════════════════════════════════════
  # NODE.JS SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  nodejs:
    name: "Node.js (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - notification-service
          - transaction-service
          - fee-engine
    defaults:
      run:
        working-directory: services/nodejs/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/nodejs/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts 2>/dev/null || echo "ESLint not configured — skipping"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --if-present

  # ═════════════════════════════════════════════════════════════════════════
  # GO SERVICES
  # ═════════════════════════════════════════════════════════════════════════
  go:
    name: "Go (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - settlement-service
          - reconciliation-service
          - compliance-service
          - dispute-service
          - merchant-service
          - identity-service
          - bank-integration
          - audit-service
    defaults:
      run:
        working-directory: services/go/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/go/${{ matrix.service }}/go.sum

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/go/${{ matrix.service }}
          args: --timeout=5m

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Build
        run: go build ./...

  # ═════════════════════════════════════════════════════════════════════════
  # DOCKER BUILD (all services)
  # ═════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build (all services)
    runs-on: ubuntu-latest
    needs: [java, python, nodejs, go]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all Docker images
        run: make docker-build

  # ═════════════════════════════════════════════════════════════════════════
  # CONTRACT VALIDATION
  # ═════════════════════════════════════════════════════════════════════════
  contract-check:
    name: Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI specs
        uses: mbowman100/swagger-validator-action@master
        with:
          files: shared/api/*.yaml

      - name: Validate Avro schemas
        run: |
          for schema in shared/events/*.avsc; do
            echo "Validating: $schema"
            python3 -c "
import json, sys
with open('$schema') as f:
    json.load(f)
print('  OK')
"
          done
