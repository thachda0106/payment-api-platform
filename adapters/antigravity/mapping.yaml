adapter: antigravity
version: "1.0.0"
target_dirs:
  - .agent/
  - .gemini/

mappings:
  context:
    ".ai/context/PROJECT.md":
      target: ".gemini/STYLE.md"
      transform: "merge_context_files"
    ".ai/context/CONVENTIONS.md":
      target: ".gemini/STYLE.md"
      transform: "append"
    ".ai/context/BOUNDARIES.md":
      target: ".gemini/STYLE.md"
      transform: "append"

  agents:
    ".ai/agents/*.agent.md":
      target: null
      transform: "skip"
      note: "Antigravity doesn't have per-agent files. Agent info is in docs."

  workflows:
    ".ai/workflows/*.md":
      target: ".agent/workflows/{filename}"
      transform: "copy"
      note: "Antigravity workflows use same YAML frontmatter format"

  skills:
    ".ai/skills/*/SKILL.md":
      target: ".agent/skills/{dirname}/SKILL.md"
      transform: "copy"

  prompts:
    ".ai/prompts/system.md":
      target: ".gemini/STYLE.md"
      transform: "append"

  scripts:
    ".ai/scripts/*.sh":
      target: ".agent/scripts/{filename}"
      transform: "copy"
    ".ai/scripts/*.js":
      target: ".agent/scripts/{filename}"
      transform: "copy"

  docs:
    ".ai/docs/*":
      target: ".agent/docs/{filename}"
      transform: "copy"
    ".ai/README.md":
      target: ".agent/README.md"
      transform: "copy"
