adapter: claude
version: "1.0.0"
target_dirs:
  - .claude/

mappings:
  context:
    ".ai/context/PROJECT.md":
      target: "CLAUDE.md"
      transform: "merge_context_files"
    ".ai/context/CONVENTIONS.md":
      target: "CLAUDE.md"
      transform: "append"
    ".ai/context/BOUNDARIES.md":
      target: "CLAUDE.md"
      transform: "append"

  agents:
    ".ai/agents/*.agent.md":
      target: ".claude/agents/{stem}.md"
      transform: "claude_agent_format"
      note: "Convert frontmatter to @agent directive format"

  workflows:
    ".ai/workflows/*.md":
      target: ".claude/commands/{filename}"
      transform: "add_agent_directive"
      note: "Convert agent: field in frontmatter to @agent directive"

  skills:
    ".ai/skills/*/SKILL.md":
      target: ".claude/skills/{dirname}/SKILL.md"
      transform: "copy"

  prompts:
    ".ai/prompts/system.md":
      target: "CLAUDE.md"
      transform: "append"
    ".ai/prompts/templates/*":
      target: ".claude/prompts/{filename}"
      transform: "copy"

  scripts:
    ".ai/scripts/*.sh":
      target: ".claude/scripts/{filename}"
      transform: "copy"
    ".ai/scripts/*.js":
      target: ".claude/hooks/{filename}"
      transform: "copy"

  docs:
    ".ai/docs/*":
      target: ".claude/docs/{filename}"
      transform: "copy"
