adapter: cursor
version: "1.0.0"
target_dirs:
  - .cursor/

mappings:
  context:
    ".ai/context/PROJECT.md":
      target: ".cursorrules"
      transform: "merge_context_files"
    ".ai/context/CONVENTIONS.md":
      target: ".cursorrules"
      transform: "append"
    ".ai/context/BOUNDARIES.md":
      target: ".cursorrules"
      transform: "append"

  agents:
    ".ai/agents/*.agent.md":
      target: null
      transform: "skip"
      note: "Cursor doesn't have per-agent files"

  workflows:
    ".ai/workflows/*.md":
      target: null
      transform: "skip"
      note: "Cursor doesn't support workflow files natively"

  skills:
    ".ai/skills/*/SKILL.md":
      target: null
      transform: "skip"
      note: "Cursor doesn't have skill modules — skills are embedded in .cursorrules"

  prompts:
    ".ai/prompts/system.md":
      target: ".cursorrules"
      transform: "append"
