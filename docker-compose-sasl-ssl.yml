# ============================================================================
# docker-compose-sasl-ssl.yml — Production SASL_SSL / SCRAM-SHA-256 override
# ============================================================================
# TLS certs generated by scripts/generate-kafka-certs.sh.
# SCRAM user created by running the kafka-configs command from that script.
# Load alongside docker-compose.yml in production:
#   docker compose -f docker-compose.yml -f docker-compose-sasl-ssl.yml up -d
# ============================================================================
services:
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:9092,SASL_SSL_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,SASL_SSL_HOST:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/tls/broker.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/tls/truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
    volumes:
      - ./shared/config/kafka/tls:/etc/kafka/tls:ro

  # Client SASL_SSL properties (overwrite the SASL_PLAINTEXT file with an SSL one)
  # This is done by volume-mounting a production client config.
  # The kafka-init-topics container also needs it.
