# ============================================================================
# docker-compose.yml — Payment API Platform Local Development Environment
# ============================================================================
# Usage:
#   docker-compose up -d              Start all infra + services
#   docker-compose up -d postgres redis kafka   Start infra only
#   docker-compose --profile services up -d      Start infra + all services
# ============================================================================

# Shared Kafka SASL + Schema Registry auth env (Phase-9 P4; dev-only credentials).
x-kafka-auth-env: &kafka-auth-env
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KAFKA_SASL_MECHANISM: PLAIN
  KAFKA_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="svc" password="svc-secret";'
  KAFKA_SASL_USERNAME: svc
  KAFKA_SASL_PASSWORD: svc-secret
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SR_BASIC_AUTH_SOURCE: USER_INFO
  SR_BASIC_AUTH_USER_INFO: sr-user:sr-secret
  SR_BASIC_AUTH_USER: sr-user
  SR_BASIC_AUTH_PASS: sr-secret

# ═══════════════════════════════════════════════════════════════════════════
# SERVICES
# ═══════════════════════════════════════════════════════════════════════════
services:

  # ──────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────────────────────────────────────────

  # PostgreSQL 16 — Primary relational database
  postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    restart: unless-stopped
    # wal_level=logical + replication slots required for Debezium CDC (Phase-9).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=8"
      - "-c"
      - "max_wal_senders=8"
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_MULTIPLE_DATABASES: >
        financial_core_db,
        payment_db,
        fraud_db,
        notification_db,
        transaction_db,
        settlement_db,
        reconciliation_db,
        compliance_db,
        dispute_db,
        merchant_db,
        identity_db,
        fee_engine_db,
        audit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - ./scripts/zz-init-cdc.sh:/docker-entrypoint-initdb.d/zz-init-cdc.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  # Redis 7 — Cache, rate limiting, session store
  redis:
    image: redis:7-alpine
    container_name: payment-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - payment-network

  # Zookeeper — Kafka dependency
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: payment-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zkdata:/var/lib/zookeeper/data
      - zklogs:/var/lib/zookeeper/log
    networks:
      - payment-network

  # Apache Kafka 3.7 — Event streaming (SASL_PLAINTEXT/PLAIN auth, Phase-9 P4; dev-only creds)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: payment-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,SASL_PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_PLAINTEXT_HOST:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Broker JAAS is provided via a mounted file (env-based listener JAAS is unreliable
      # because the cp image converts underscores in listener names to dots).
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/broker-jaas.conf -Dzookeeper.sasl.client=false"
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafkadata:/var/lib/kafka/data
      - ./shared/config/kafka/broker-jaas.conf:/etc/kafka/broker-jaas.conf:ro
      - ./shared/config/kafka/client-sasl.properties:/etc/kafka/client-sasl.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 --command-config /etc/kafka/client-sasl.properties >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - payment-network

  # Kafka init — auto-create is disabled, so ALL topics are created explicitly here.
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.0
    container_name: payment-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./shared/config/kafka/client-sasl.properties:/etc/kafka/client-sasl.properties:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        CFG="--command-config /etc/kafka/client-sasl.properties"
        echo "Creating Phase-9 domain topics..."
        for topic in payments.payment.created payments.payment.succeeded payments.payment.failed ledger.entry.committed notifications.email.queued; do
          kafka-topics --bootstrap-server kafka:9092 $$CFG \
            --create --if-not-exists \
            --topic $$topic \
            --partitions 3 \
            --config cleanup.policy=delete \
            || echo "Topic $$topic already exists (that's fine)"
        done
        echo "Creating per-domain DLQ topics (30-day retention)..."
        for topic in payments.dlq ledger.dlq notifications.dlq; do
          kafka-topics --bootstrap-server kafka:9092 $$CFG \
            --create --if-not-exists \
            --topic $$topic \
            --partitions 3 \
            --config retention.ms=2592000000 \
            --config cleanup.policy=delete \
            || echo "Topic $$topic already exists (that's fine)"
        done
        echo "All topics created."
    networks:
      - payment-network

  # Confluent Schema Registry — Avro schema management (SASL to Kafka + HTTP BASIC auth, P4)
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: payment-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="svc" password="svc-secret";'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_AUTHENTICATION_METHOD: BASIC
      SCHEMA_REGISTRY_AUTHENTICATION_REALM: SchemaRegistry
      SCHEMA_REGISTRY_AUTHENTICATION_ROLES: admin
      SCHEMA_REGISTRY_OPTS: "-Djava.security.auth.login.config=/etc/schema-registry/sr-jaas.conf"
    volumes:
      - ./shared/config/schema-registry/sr-jaas.conf:/etc/schema-registry/sr-jaas.conf:ro
      - ./shared/config/schema-registry/sr-users.properties:/etc/schema-registry/sr-users.properties:ro
    ports:
      - "8081:8081"
    networks:
      - payment-network

  # Debezium / Kafka Connect — CDC outbox → Kafka (Avro via Schema Registry).
  # Uses cp-kafka-connect (has AvroConverter) + installs the Debezium PostgreSQL
  # connector at startup. Connectors are registered via scripts/register-connectors.sh.
  debezium-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: payment-debezium-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: debezium-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_BASIC_AUTH_CREDENTIALS_SOURCE: USER_INFO
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: sr-user:sr-secret
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium-connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      # SASL to Kafka (worker + producer + consumer + admin)
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="svc" password="svc-secret";'
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="svc" password="svc-secret";'
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="svc" password="svc-secret";'
    command:
      - bash
      - -c
      - |
        echo "Installing Debezium PostgreSQL connector..."
        confluent-hub install --no-prompt debezium/debezium-connector-postgresql:2.5.4
        echo "Starting Kafka Connect..."
        /etc/confluent/docker/run
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - payment-network

  # OpenSearch 2.11 — Search & analytics
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: payment-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - osdata:/usr/share/opensearch/data
    networks:
      - payment-network

  # OpenSearch Dashboards
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: payment-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    networks:
      - payment-network

  # Jaeger — Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: payment-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"   # Jaeger UI
      # OTLP ports NOT exposed to host — otel-collector handles ingress
      - "14250:14250"   # gRPC (legacy)
    networks:
      - payment-network

  # OpenTelemetry Collector — Receives, batches, and exports traces
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: payment-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./shared/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC (services → collector)
      - "4318:4318"     # OTLP HTTP (services → collector)
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - payment-network

  # Prometheus — Metrics collection
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: payment-prometheus
    restart: unless-stopped
    volumes:
      - ./shared/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./shared/config/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - payment-network

  # Grafana — Metrics dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: payment-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafdata:/var/lib/grafana
    networks:
      - payment-network

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES (enabled via --profile services)
  # Each service uses its language-specific Dockerfile from docker/
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── Java: Financial Core (Ledger + Wallet) ───
  financial-core:
    profiles: ["services"]
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        SERVICE_PATH: services/java/financial-core
    container_name: payment-financial-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kafka-auth-env
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/financial_core_db
      DATABASE_USERNAME: payment
      DATABASE_PASSWORD: payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: financial-core
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: financial-core
      SERVICE_VERSION: "0.1.0"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    networks:
      - payment-network

  # ─── Java: Payment Service (Payment API + Outbox) ───
  payment-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: docker/Dockerfile.java
      args:
        SERVICE_PATH: services/java/payment-service
    container_name: payment-payment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kafka-auth-env
      SERVER_PORT: "8081"
      DATABASE_URL: jdbc:postgresql://postgres:5432/payment_db
      DATABASE_USERNAME: payment
      DATABASE_PASSWORD: payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: payment-service
      SERVICE_VERSION: "0.1.0"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8081:8081"
    networks:
      - payment-network

  # ─── Python: Fraud Service ───
  fraud-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/python/fraud-service
    container_name: payment-fraud-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kafka-auth-env
      SERVER_PORT: "8000"
      DATABASE_URL: postgresql://payment:payment@postgres:5432/fraud_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: fraud-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: fraud-service
      SERVICE_VERSION: "0.1.0"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    networks:
      - payment-network

  # ─── Node.js: Notification Service ───
  notification-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: docker/Dockerfile.nodejs
      args:
        SERVICE_PATH: services/nodejs/notification-service
    container_name: payment-notification-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kafka-auth-env
      SERVER_PORT: "3001"
      DATABASE_URL: postgresql://payment:payment@postgres:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: notification-service
      SERVICE_VERSION: "0.1.0"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "3001:3001"
    networks:
      - payment-network

  # ─── Go: Settlement Service ───
  settlement-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/settlement-service
    container_name: payment-settlement-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: "8088"
      DATABASE_URL: postgresql://payment:payment@postgres:5432/settlement_db?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: settlement-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: settlement-service
      SERVICE_VERSION: "0.1.0"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8088:8088"
    networks:
      - payment-network

# ═══════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════════════
networks:
  payment-network:
    name: payment-network
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  pgdata:
    name: payment-pgdata
  redisdata:
    name: payment-redisdata
  zkdata:
    name: payment-zkdata
  zklogs:
    name: payment-zklogs
  kafkadata:
    name: payment-kafkadata
  osdata:
    name: payment-osdata
  promdata:
    name: payment-promdata
  grafdata:
    name: payment-grafdata
