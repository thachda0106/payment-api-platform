# ============================================================================
# Financial Core — application.yml (production profile)
# ============================================================================
spring:
  application:
    name: financial-core
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:payment}
    password: ${DATABASE_PASSWORD:payment}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:financial-core}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  flyway:
    enabled: true

# ─── Platform Libs ────────────────────────────────────────────────────────
platform:
  server:
    port: ${SERVER_PORT:8080}
    host: ${SERVER_HOST:0.0.0.0}
  database:
    url: ${DATABASE_URL:}
    max-pool-size: ${DB_MAX_POOL_SIZE:10}
    min-idle: ${DB_MIN_IDLE:2}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer-group: ${KAFKA_CONSUMER_GROUP:financial-core}
  logging:
    level: ${LOG_LEVEL:info}
    format: ${LOG_FORMAT:json}
  otel:
    service-name: ${OTEL_SERVICE_NAME:financial-core}
    service-version: ${SERVICE_VERSION:0.1.0}
    exporter-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}

# ─── Server ───────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ─── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
