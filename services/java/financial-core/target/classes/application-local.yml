# ============================================================================
# Financial Core — application-local.yml (local development profile)
# ============================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false  # Disable Flyway in local; use JPA ddl-auto for quick iteration

platform:
  logging:
    format: text  # Human-readable logs in local dev
    level: debug
  otel:
    exporter-endpoint: http://localhost:4317
    service-name: financial-core
