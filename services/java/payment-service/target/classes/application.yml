spring:
  application:
    name: payment-service
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  flyway:
    enabled: true

platform:
  server:
    port: ${SERVER_PORT:8081}
    host: ${SERVER_HOST:0.0.0.0}
  database:
    url: ${DATABASE_URL:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer-group: ${KAFKA_CONSUMER_GROUP:payment-service}
  logging:
    level: ${LOG_LEVEL:info}
    format: ${LOG_FORMAT:json}
  otel:
    service-name: ${OTEL_SERVICE_NAME:payment-service}
    service-version: ${SERVICE_VERSION:0.1.0}
    exporter-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
