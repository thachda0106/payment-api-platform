// Broker-side JAAS for Kafka SASL/PLAIN (Phase-9 P4; dev-only credentials).
// user_<name>="<password>" entries define the accounts the broker accepts.
// username/password are the broker's own identity for inter-broker auth.
KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="broker"
  password="broker-secret"
  user_broker="broker-secret"
  user_svc="svc-secret";
};
