# SASL client properties for CLI tools (kafka-topics, healthcheck, avro console consumer).
# Dev-only credentials (Phase-9 P4). Production uses secrets + SASL_SSL/mTLS.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="svc" password="svc-secret";
